# nginx config for the Issuez container.
#
# The app is one self-contained dist/index.html plus the files copied out of
# assets/, so there is no proxying and no backend: this server only needs to
# hand over files with the right content types and the response headers a
# static host could not set on GitHub Pages.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $status $request_length ${body_bytes_sent} '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/manifest+json
                      image/svg+xml;

    server {
        # IPv4 only on purpose: `listen [::]:80` aborts startup on hosts with
        # IPv6 disabled, which is why the stock nginx image omits it too.
        listen      80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # The dashboard ships its CSP in a <meta> tag because GitHub Pages
        # cannot set response headers. nginx can, so it supplies the two
        # protections a <meta> policy cannot express: browsers ignore
        # frame-ancestors delivered in the document, and the doc comment in
        # index.html explicitly says the host has to set it.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The whole app is inlined into index.html, so a request for any other
        # path is a stale deep link rather than a real route: serve the entry
        # point instead of a 404.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Nothing in this build is content-hashed, so the entrypoint and the
        # assets must all revalidate. expires (not add_header) is used
        # deliberately: an add_header in this block would drop the inherited
        # security headers above, because nginx replaces the whole add_header
        # set at the level where one is defined.
        location ~* \.(?:html|webmanifest|svg)$ {
            expires -1;
        }

        # nginx's mime.types has no entry for .webmanifest, so the manifest
        # would fall back to application/octet-stream and Chrome would refuse
        # to treat the dashboard as installable. A types block in this location
        # replaces the inherited map for this one file, which is what we want.
        # An exact-match location outranks the regex block above, so the
        # revalidate directive has to be repeated here.
        location = /manifest.webmanifest {
            expires -1;
            types {
                application/manifest+json webmanifest;
            }
        }
    }
}
